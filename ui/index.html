<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>litepet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body data-tauri-drag-region="deep">
    <!-- 拖拽：`deep` 表示“子树里任意点击都拖窗”（tauri 2.11.6
         `src/window/scripts/drag.js` 的 isDragRegion：裸写属性只对直接点多那个元素生效，
         而这里能接住点击的是盖满窗口的 #pet）。单击拖、双击最大化。
         注意它最终调的是 `plugin:window|start_dragging`，所以 capabilities 里
         必须有 `core:window:allow-start-dragging`，否则点了没任何反应。 -->
    <!-- 图集视口：整屏只有一个元素，靠 background-position 切到当前帧 -->
    <div id="pet" class="pet" role="img" aria-label="桌面宠物"></div>
    <!-- 气泡：内容与显隐完全由 daemon 推来的 DisplayDirective 决定 -->
    <div id="bubble" class="bubble" role="status" data-kind="info" hidden></div>
    <script src="pet.js"></script>
  </body>
</html>
