name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '是否发布为草稿 (Draft)'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            artifact-name: LitePet-macOS-Universal
            asset-path: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - platform: windows-latest
            args: ''
            artifact-name: LitePet-Windows
            asset-path: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2

      - name: 安装前端/打包依赖
        run: npm install

      - name: 编译与打包 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: 'LitePet v__VERSION__'
          releaseBody: |
            ### 🐾 LitePet 桌面宠物跨平台发布
            
            本安装包由 GitHub Actions 自动编译打包完成：
            - **Windows**: `.exe`（NSIS 一键安装包）
            - **macOS**: `.dmg`（Universal 通用架构，同时兼容 Apple Silicon M 系列与 Intel 处理器）
            
            更多使用说明请参阅 [项目 README](https://github.com/gunduziba/litepet)。
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false

      - name: 备份上传构建产物至 Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.asset-path }}
          if-no-files-found: warn
